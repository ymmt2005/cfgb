version: 2
project_name: cfgb
before:
  hooks:
    - node scripts/release-metadata.mjs
builds:
  - id: cfgb
    main: ./cmd/cfgb
    binary: cfgb
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/ymmt2005/cfgb/internal/version.Version={{ .Tag }}
archives:
  - formats: [binary]
    name_template: "cfgb-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  github:
    owner: ymmt2005
    name: cfgb
  draft: true
  use_existing_draft: true
  target_commitish: "{{ .Commit }}"
  extra_files:
    - glob: .release/toolchain-requirements.json
    - glob: LICENSE
  header: |
    CFGB — Git-based Blog on Cloudflare.

    CFGB implements `cfgb build` with the embedded renderer and
    Pagefind search. Content repositories need only Markdown, assets and blog
    settings. Use `--base-url` and `--static` for GitHub Pages and other static hosts.

    Building requires Node.js and npm or pnpm compatible with the attached
    `toolchain-requirements.json`. CLI setup is available through `ymmt2005/cfgb-action`.
    Authoring, migration and Cloudflare upload commands are not implemented yet.
