name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CFGB_EXAMPLE_REF: 8f09a38a373c0187437a6608559ca3c62f5fe42f

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # TestExampleCorpus builds the Astro renderer, so it needs Node and npm
      # or pnpm. Those combinations run in the typescript jobs.
      - name: Test
        run: go test ./... -skip '^TestExample(Corpus|StaticHost)$'
      - name: Staticcheck
        run: go tool staticcheck ./...
      - name: Check returned errors
        # -blank catches explicit error discards; fmt is otherwise ignored by
        # errcheck by default. Keep its documented infallible stdlib excludes.
        run: go tool errcheck -blank -ignore 'fmt:a^' ./...
      - name: Format
        run: test -z "$(gofmt -l .)"

  typescript:
    name: typescript (Node ${{ matrix.node }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.21.0", "26.10.0"]
        package-manager: ["npm", "pnpm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Release workflow tests
        run: node --test scripts/tests/release*.test.mjs
      - name: Install npm 12
        if: matrix.package-manager == 'npm'
        run: npm install -g npm@12.2.0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: matrix.package-manager == 'pnpm'
        with:
          version: "12.8.1"
          install: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ymmt2005/cfgb-example
          ref: ${{ env.CFGB_EXAMPLE_REF }}
          path: cfgb-example
      - name: Identify dependency cache runtime
        id: dependency-runtime
        run: |
          cfgb_node_version="$(node -p process.versions.node)"
          cfgb_manager_version="$("${{ matrix.package-manager }}" --version)"
          printf 'runtime=%s-%s-%s\n' "$cfgb_node_version" "${{ matrix.package-manager }}" "$cfgb_manager_version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cfgb-cache/dependencies
          key: cfgb-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-runtime.outputs.runtime }}-${{ hashFiles('renderer/package.json', 'renderer/package-lock.json', 'renderer/pnpm-lock.yaml', 'renderer/pnpm-workspace.yaml', '.github/workflows/ci.yml') }}
      - name: Renderer unit tests
        working-directory: renderer
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            COREPACK_ENABLE_AUTO_PIN=0 pnpm install --frozen-lockfile
          else
            npm ci
          fi
          node --test tests/*.test.mjs
      - name: Browser interaction tests
        if: matrix.node == '24.21.0' && matrix.package-manager == 'npm'
        working-directory: renderer/tests/browser
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          node --test *.test.mjs
      - name: Test
        env:
          CFGB_CACHE_DIR: ${{ runner.temp }}/cfgb-cache
          CFGB_EXAMPLE: ${{ github.workspace }}/cfgb-example
          CFGB_REQUIRE_EXAMPLE: "1"
          CFGB_PACKAGE_MANAGER: ${{ matrix.package-manager }}
          CFGB_REQUIRE_SEARCH: ${{ matrix.node == '24.21.0' && matrix.package-manager == 'npm' && '1' || '0' }}
        run: go test ./internal/build -run '^TestExample(Corpus|StaticHost)$' -count=1

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AQUA_ENFORCE_CHECKSUM: "true"
      AQUA_ENFORCE_REQUIRE_CHECKSUM: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install npm 12
        run: npm install -g npm@12.2.0
      - name: Identify dependency cache runtime
        id: dependency-runtime
        run: |
          cfgb_node_version="$(node -p process.versions.node)"
          cfgb_manager_version="$(npm --version)"
          printf 'runtime=%s-npm-%s\n' "$cfgb_node_version" "$cfgb_manager_version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cfgb-cache/dependencies
          key: cfgb-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-runtime.outputs.runtime }}-${{ hashFiles('renderer/package.json', 'renderer/package-lock.json', 'renderer/pnpm-lock.yaml', 'renderer/pnpm-workspace.yaml', '.github/workflows/ci.yml') }}
      - name: Install checksum-pinned lychee with aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
          aqua_opts: ""
      - name: Check that tool checksums stayed fixed
        run: git diff --exit-code -- aqua-checksums.json
      - name: Check link-checker routing with real lychee
        run: node --test scripts/tests/check-links.test.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ymmt2005/cfgb-example
          ref: ${{ env.CFGB_EXAMPLE_REF }}
          path: cfgb-example
      - name: Build CFGB
        run: go build -o "$RUNNER_TEMP/cfgb" ./cmd/cfgb
      - name: Build example HTML
        env:
          CFGB_CACHE_DIR: ${{ runner.temp }}/cfgb-cache
        working-directory: cfgb-example
        run: '"$RUNNER_TEMP/cfgb" build --force --out dist'
      - name: Check every generated HTML file offline
        run: node scripts/check-links.mjs cfgb-example/dist/site https://example.invalid --config .github/lychee.toml

  # The single status check to require in a ruleset. A skipped job is reported
  # as success, so this stays skipped unless a needed job fails or is cancelled,
  # and then it runs and fails. Add every new job to needs.
  required:
    name: required
    runs-on: ubuntu-latest
    needs: [go, typescript, links]
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    steps:
      - name: Fail because an upstream job failed
        run: |
          echo "::error::A CI job failed or was cancelled."
          exit 1
