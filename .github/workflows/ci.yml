name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.2.1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -skip '^TestExampleCorpus$'
      - name: Staticcheck
        run: staticcheck ./...
      - name: Format
        run: test -z "$(gofmt -l .)"

  typescript:
    name: typescript (Node ${{ matrix.node }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.21.0", "26.10.0"]
        package-manager: ["npm", "pnpm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install npm 12
        if: matrix.package-manager == 'npm'
        run: npm install -g npm@12.2.0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: matrix.package-manager == 'pnpm'
        with:
          version: "12.8.1"
          install: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ymmt2005/cfgb-example
          path: cfgb-example
      - name: Test
        env:
          CFGB_EXAMPLE: ${{ github.workspace }}/cfgb-example
          CFGB_REQUIRE_EXAMPLE: "1"
          CFGB_PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: go test ./internal/build -run '^TestExampleCorpus$' -count=1

  # The single status check to require in a ruleset. A skipped job is reported
  # as success, so this stays skipped unless a needed job fails or is cancelled,
  # and then it runs and fails. Add every new job to needs.
  required:
    name: required
    runs-on: ubuntu-latest
    needs: [go, typescript]
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    steps:
      - name: Fail because an upstream job failed
        run: |
          echo "::error::A CI job failed or was cancelled."
          exit 1
