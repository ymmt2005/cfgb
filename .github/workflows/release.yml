name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cfgb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect version bump
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-detect.sh
      - name: Check release notes before tagging
        if: steps.detect.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        run: test -s "docs/releases/$RELEASE_TAG.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.release == 'true'
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.release == 'true'
        with:
          node-version: "24.21.0"
      - name: Install and test
        if: steps.detect.outputs.release == 'true'
        run: |
          npm install -g npm@12.2.0
          npm ci --prefix renderer
          node --test renderer/tests/*.test.mjs scripts/tests/release*.test.mjs
          go test ./... -skip '^TestExample(Corpus|StaticHost)$'
      - name: Tag
        if: steps.detect.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists"
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Tag $RELEASE_TAG points at $tag_commit, not this commit $GITHUB_SHA"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.detect.outputs.release == 'true'
        with:
          version: v2.18.2
          args: release --clean --release-notes docs/releases/${{ steps.detect.outputs.tag }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke-test the draft binary before publishing
        if: steps.detect.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        run: |
          binary="$(find dist -type f -name cfgb -path '*linux_amd64*' -print -quit)"
          test -n "$binary"
          test "$("$binary" version)" = "cfgb $RELEASE_TAG"
      - name: Publish immutable release
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo ymmt2005/cfgb --draft=false --latest
      - name: Verify published release
        if: steps.detect.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        # GitHub generates the release attestation after publication. A rerun
        # verifies the existing immutable release without publishing it again.
        run: |
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo ymmt2005/cfgb; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
