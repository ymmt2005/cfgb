name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfgb-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = readFileSync('VERSION', 'utf8').trim();
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('VERSION must be an exact release tag');
          const response = await fetch(`https://api.github.com/repos/ymmt2005/cfgb/releases/tags/${version}`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`}});
          if (response.status !== 404 && !response.ok) throw new Error(`Release lookup failed: ${response.status}`);
          const release = response.ok ? await response.json() : null;
          if (release && !release.draft && !release.immutable) throw new Error('Existing release is not immutable');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${version}\npublish=${!release || release.draft}\n`);
          JS
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.version.outputs.publish == 'true'
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: "24.21.0"
      - name: Create local release tag
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$RELEASE_TAG"
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        if: steps.version.outputs.publish == 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke-test the draft binary before publishing
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          binary="$(find dist -type f -name cfgb -path '*linux_amd64*' -print -quit)"
          test -n "$binary"
          test "$("$binary" version)" = "cfgb $RELEASE_TAG"
      - name: Publish immutable release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo ymmt2005/cfgb --draft=false --latest
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        # GitHub generates the release attestation after publication. A rerun
        # verifies the existing immutable release without publishing it again.
        run: |
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo ymmt2005/cfgb; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
